<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Atala Malalai English Academy</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#ffffff"><link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--d:#0c2b8a;--l:#1ea7e8;--t:#eaf6fe;--b:#bfe4f8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--d);font:15px/1.4 system-ui,Arial,sans-serif;overflow-x:hidden}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#fff;border-bottom:3px solid var(--l);display:flex;align-items:center;gap:10px;padding:8px 12px}
header img{width:62px;height:62px;object-fit:contain;flex:none}
header h1{margin:0;font:700 clamp(17px,5.4vw,28px)/1.15 "Times New Roman",Times,serif}
main{max-width:760px;margin:0 auto;padding:12px}h2,h3{margin:0 0 4px}
.card{border:1.5px solid var(--b);border-radius:14px;padding:12px;margin:10px 0;box-shadow:0 2px 8px #1ea7e822}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;padding:10px 12px;background:var(--d);color:#fff;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center}
.s{background:var(--t);color:var(--d);border:1.5px solid var(--l)}.on{background:var(--d);color:#fff}button:disabled{opacity:.4}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 0;min-width:100px}
.tile{width:100%;justify-content:flex-start;background:#fff;color:var(--d);border:1.5px solid var(--b);margin:6px 0;padding:8px 12px;text-align:left}
.ic{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,var(--l),var(--d));display:grid;place-items:center;flex:none;box-shadow:0 3px 6px #0c2b8a44}.ic svg{width:26px;height:26px;fill:#fff}
.g4{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g4 div{background:var(--t);border-radius:12px;padding:8px 10px}.g4 b{font-size:22px;display:block}
input{font:inherit;padding:10px;border:1.5px solid var(--l);border-radius:10px;width:100%;color:var(--d);background:#fff}label{display:block;margin-top:8px;font-weight:600}
small{opacity:.85;font-size:.78em;font-weight:400}.ps{font-family:"Noto Naskh Arabic","Segoe UI",Tahoma,serif;direction:rtl;unicode-bidi:isolate}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}th,td{border:1px solid var(--b);padding:3px 2px;text-align:center;overflow-wrap:anywhere}th{background:var(--d);color:#fff}td:nth-child(2){text-align:left}
.chip{padding:2px 10px;min-height:32px;font-size:14px;border-radius:8px}.wa{background:#fff;color:#128c4a;border:1.5px solid #25D366}.wa svg{width:22px;height:22px}
svg.ch{width:100%;height:auto}#md{position:fixed;inset:0;background:#0c2b8a99;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}
#md>div{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:420px;max-height:90vh;overflow:auto}footer{text-align:center;padding:16px;font-weight:600}
@media print{header{position:static}.np,#md,footer{display:none!important}}
</style></head><body>

<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');

let S={set:{teacher:''},cl:[],st:[],ex:{},fin:{},n:{c:0,s:0}};
const SEC=[['voc','Vocabulary','لغتونه'],['spk','Speaking','خبرې کول'],['att','Attendance','حاضري'],['wb','Workbook','کاري کتابچه']];

const sum=a=>a.reduce((x,y)=>x+y.v,0),sc=(r,k)=>r.e[k].length?Math.min(5,sum(r.e[k])):null;

const gr=p=>p>=90?'A':p>=80?'B':p>=70?'C':p>=60?'D':p>=55?'E':'F';
function addv(a,v){const l=5-sum(a);if(v>0&&l<=0)return;a.push({v:Math.min(v,l),d:Date.now()})}
function rk(r){const o=r.filter(x=>x.p!=null).sort((a,b)=>b.p-a.p);o.forEach((x,i)=>x.pos=i&&o[i-1].p==x.p?o[i-1].pos:i+1);return[...o,...r.filter(x=>x.p==null)]}

function miss(c,t){const o=[];S.st.filter(s=>s.c==c).forEach(s=>{const r=R(c,s.id,t);if(r.q==null)o.push([s,'Quiz']);if(r.t==null)o.push([s,'Test']);SEC.forEach(([k,n])=>{if(!r.e[k].length)o.push([s,n])})});return o}
function crc(b){let t=crc.t;if(!t){t=crc.t=[];for(let i=0,c;i<256;i++){c=i;for(let n=0;n<8;n++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t.push(c>>>0)}}let r=-1;for(const x of b)r=t[(r^x)&255]^(r>>>8);return(r^-1)>>>0}

function Pend(){let h='<h2>Pending Assessment</h2>';S.cl.forEach(c=>['m','f'].forEach(t=>{const m=S.fin[c.id+'.'+t]?[]:miss(c.id,t);if(m.length)h+=`<div class="card"><b>Class ${c.id} — ${esc(c.name)} · ${TY[t][0]}</b><br>${m.slice(0,30).map(([s,w])=>esc(s.name)+' — '+w+' not assessed').join('<br>')}${m.length>30?'<br>+'+(m.length-30)+' more':''}<p><button onclick="go({n:'class',c:${c.id},tab:'mk',t:'${t}'})">Continue Assessment</button></p></div>`}));return h.length>30?h:h+'<p>Nothing pending.</p>'}
function Set(){return `<h2>Settings</h2><div class="card"><label>Teacher Name <small class="ps">د ښوونکي نوم</small><input value="${esc(S.set.teacher)}" onchange="S.set.teacher=this.value.trim();sv()"></label></div><div class="card"><h3>Backup and Restore</h3><small>Keep a backup file in a safe place. Clearing the browser data deletes all marks.</small><div class="row" style="margin-top:8px"><button onclick="bk()">Backup</button><button class="s" onclick="bks()">Share Backup</button></div><label>Restore from backup file<input type="file" accept=".json,application/json" onchange="rs2(this)"></label></div><div class="card">Atala Malalai English Academy<br><small>Engineer Ehsanullah Habib 2026</small></div>`}
const bf=()=>new File([JSON.stringify(S)],'AMEA_Backup_'+new Date().toISOString().slice(0,10)+'.json',{type:'application/json'});
function bk(){const f=bf(),a=document.createElement('a');a.href=URL.createObjectURL(f);a.download=f.name;a.click()}
async function bks(){const f=bf();try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:f.name});return}}catch(e){if(e.name=='AbortError')return}alert('Sharing is not supported here. Use Backup instead.')}
function rs2(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.cl)||!Array.isArray(o.st)||!o.ex||!o.fin||!o.n)throw 0;if(!confirm('Restore this backup? It will REPLACE all current data on this device.'))return;S=o;sv();home();alert('Backup restored.')}catch(e){alert('This is not a valid AMEA backup file.')}};r.readAsText(f);i.value=''}
function form(t,F,v,cb){dlg(`<h3>${t}</h3>`+F.map(([k,l,ty])=>`<label>${l}<input id="f_${k}" ${ty?'type='+ty:''} value="${esc(v[k]||'')}"></label>`).join('')+`<div class="row" style="margin-top:12px"><button id="fok">Save</button><button class="s" onclick="X()">Cancel</button></div>`);
$('#fok').onclick=()=>{const o={};F.forEach(([k])=>o[k]=$('#f_'+k).value.trim());if(!o[F[0][0]]){alert('Name is required');return}if(cb(o)===false)return;X()}}
function clF(id){const c=S.cl.find(x=>x.id==id)||{};form(id?'Edit Class':'Add Class',[['name','Class name'],['time','Class time (e.g. 4:00 PM)']],c,o=>{if(id)Object.assign(c,o);else S.cl.push({id:++S.n.c,...o});sv();draw()})}
function clD(id){if(confirm('Delete this class with all its students and marks?')){S.st=S.st.filter(s=>s.c!=id);Object.keys(S.ex).forEach(k=>k.split('.')[0]==id&&delete S.ex[k]);Object.keys(S.fin).forEach(k=>k.split('.')[0]==id&&delete S.fin[k]);S.cl=S.cl.filter(c=>c.id!=id);sv();home()}}
function stF(cid,id){const s=S.st.find(x=>x.id==id)||{};form(id?'Edit Student':'Add Student',[['name','Student Name'],['father',"Father's Name"],['phone','Student Phone','tel'],['fphone','Family/Father Phone','tel']],s,o=>{if(!ok(o.phone)||!ok(o.fphone)){alert('Phone format: 07XXXXXXXX or +937XXXXXXXX');return false}
if(id)Object.assign(s,o);else S.st.push({id:++S.n.s,code:'AMEA-'+String(S.n.s).padStart(4,'0'),c:cid,...o});sv();draw()})}
function stD(id){if(confirm('Delete this student and all marks?')){Object.keys(S.ex).forEach(k=>k.split('.')[1]==id&&delete S.ex[k]);S.st=S.st.filter(s=>s.id!=id);sv();back()}}
load().then(draw);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
